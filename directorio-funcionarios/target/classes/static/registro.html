<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear usuario · Directorio de funcionarios</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Directorio de funcionarios</h1>
</header>

<main class="auth">
    <section class="tarjeta auth-tarjeta">
        <h2>Crear usuario</h2>
        <p class="subtitulo">Regístrate para acceder al directorio.</p>

        <div id="mensaje" class="mensaje" role="alert" hidden></div>

        <form id="formRegistro" novalidate>
            <div class="campo">
                <label for="username">Usuario *</label>
                <input type="text" id="username" autocomplete="username" maxlength="20" autofocus>
                <small class="ayuda">4 a 20 caracteres: letras, números, punto, guion y guion bajo.</small>
                <small class="error" data-error-for="username"></small>
            </div>
            <div class="campo">
                <label for="email">Correo *</label>
                <input type="email" id="email" autocomplete="email" maxlength="100">
                <small class="error" data-error-for="email"></small>
            </div>
            <div class="campo">
                <label for="password">Contraseña *</label>
                <input type="password" id="password" class="pw" autocomplete="new-password" maxlength="64">
                <ul id="reglas" class="reglas" aria-live="polite"></ul>
                <small class="error" data-error-for="password"></small>
            </div>
            <div class="campo">
                <label for="confirmarPassword">Confirmar contraseña *</label>
                <input type="password" id="confirmarPassword" class="pw" autocomplete="new-password" maxlength="64">
                <small class="error" data-error-for="confirmarPassword"></small>
            </div>
            <label class="check">
                <input type="checkbox" id="mostrarPassword"> Mostrar contraseñas
            </label>
            <button type="submit" id="btnRegistrar" class="primario">Crear usuario</button>
        </form>

        <p class="enlace">¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
    </section>
</main>

<script src="auth.js"></script>
</body>
</html>
